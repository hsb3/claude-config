project_name: "claude-config"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["modes", "docs", "install", "config"]
definition_of_done: ["Acceptance criteria verified with evidence: a test, probe or command output", "./install.sh re-run when modes/, bin/ or global/ changed", "Live config changes logged in CUSTOMIZATIONS.md"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "hx"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
